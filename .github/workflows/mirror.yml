name: Mirror Firestore → data/
on:
  schedule:
    - cron: "*/17 * * * *"
  workflow_dispatch: {}
concurrency:
  group: mirror
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate data/ from live Firestore
        run: python3 scripts/mirror.py
      - name: Commit if changed
        run: |
          git config user.name  "thesis-tracker-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "Mirror: refresh data/ from live app [skip ci]"
            git push
          else
            echo "No data changes."
          fi
