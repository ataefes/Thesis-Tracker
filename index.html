<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Thesis Tracker</title>
<style>html,body{margin:0;height:100%}body{background:#26241e;color:#e9e4d6;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="l">Loading…</div>
<script>
(function(){
  function go(v){ location.replace('app.html?v=' + encodeURIComponent(v)); }
  fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : Promise.reject(); })
    .then(function(t){ go((t||'').trim() || String(Date.now())); })
    .catch(function(){ go(String(Date.now())); });
})();
</script>
</body>
</html>
